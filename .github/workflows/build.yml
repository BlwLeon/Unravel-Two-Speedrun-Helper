name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build exe
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name UT2SpeedrunHelper --add-data "src\ut2helper\lua;ut2helper\lua" --paths src run_helper.py
      - uses: actions/upload-artifact@v4
        with:
          name: UT2SpeedrunHelper
          path: dist/UT2SpeedrunHelper.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/UT2SpeedrunHelper.exe
