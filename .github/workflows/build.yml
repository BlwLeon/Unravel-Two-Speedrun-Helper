name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build exe
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name UT2SpeedrunHelper --add-data "src\ut2helper\lua;ut2helper\lua" --paths src run_helper.py
      - uses: actions/upload-artifact@v4
        with:
          name: UT2SpeedrunHelper
          path: dist/UT2SpeedrunHelper.exe
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/ut2helper/__init__.py)" >> "$GITHUB_OUTPUT"
      # Every push to main publishes the exe as release v<version> (tag is created if missing).
      # Bump __version__ in src/ut2helper/__init__.py to start a new release.
      - name: Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Unravel Two Speedrun Helper ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/UT2SpeedrunHelper.exe
          body: |
            **Download `UT2SpeedrunHelper.exe` below**, start it and click PRACTICE, SPEEDRUN or VANILLA.
            See the [README](https://github.com/${{ github.repository }}#readme) for details.

            Windows may show a SmartScreen warning because the exe is not signed: *More info → Run anyway*.
